version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: technofarm_postgres
    restart: always
    environment:
      POSTGRES_USER: technouser
      POSTGRES_PASSWORD: technopassword123
      POSTGRES_DB: technofarm_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: