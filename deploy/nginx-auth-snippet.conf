# Example location block only: merge inside your HTTPS `server {}` block.
# Bind the Next.js service to loopback, never directly to the public internet.
location / {
    # Forward HTTP requests to the single local Next.js process.
    proxy_pass http://127.0.0.1:3000;
    # Use HTTP/1.1 for consistent upstream keepalive and upgrades.
    proxy_http_version 1.1;
    # Preserve the trusted public hostname for OAuth callback URL handling.
    proxy_set_header Host $host;
    # OVERWRITE the client-supplied IP header, do not forward its value as-is.
    proxy_set_header X-Real-IP $remote_addr;
    # OVERWRITE the forwarded-for chain for direct Nginx-to-client deployments.
    proxy_set_header X-Forwarded-For $remote_addr;
    # Preserve the original TLS scheme so the app knows it is served over HTTPS.
    proxy_set_header X-Forwarded-Proto $scheme;
    # Preserve the public host consistently.
    proxy_set_header X-Forwarded-Host $host;
}
